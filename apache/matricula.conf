# Opcional: Apache HTTP Server como proxy a Apache Tomcat.
# Habilitar mod_proxy y mod_proxy_http e incluir este archivo desde httpd.conf.
# Puerto dedicado para no interferir con los sitios existentes del puerto 80.
Listen 127.0.0.1:8089
<VirtualHost 127.0.0.1:8089>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/
</VirtualHost>
